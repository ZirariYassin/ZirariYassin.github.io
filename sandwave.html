:root {
  --horizon: #e8a872;          /* couleur de l'horizon : fond tant que le monde n'est pas dessiné */
  --night: #131944;            /* indigo de la nuit dans l'Anti-Atlas */
  --glass: rgba(18, 22, 62, 0.52);
  --glass-strong: rgba(16, 20, 58, 0.80);
  --glass-line: rgba(255, 212, 140, 0.38);
  --text: #fff3de;
  --text-dim: rgba(255, 236, 208, 0.78);
  --accent: #ffb02e;           /* safran */
  --henna: #c8341f;
  --turq: #28b5b0;
  --font-display: 'Reem Kufi', 'Forum', 'Optima', 'Gill Sans', 'Palatino Linotype', serif;
  --font-body: 'Jost', 'Gill Sans', 'Trebuchet MS', sans-serif;
  --font-tfng: 'Tfng', 'Noto Sans Tifinagh', 'Ebrima', 'Noto Sans', sans-serif;
  /* motifs tissés (SVG en ligne) : zigzag et rangée de losanges, comme les bordures des tapis de Taznakht */
  --zig: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='10' viewBox='0 0 24 10'><path d='M0 8 6 2 12 8 18 2 24 8' fill='none' stroke='%23ffb02e' stroke-width='2'/></svg>");
  --loz: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='12' viewBox='0 0 20 12'><path d='M10 0 20 6 10 12 0 6Z' fill='%23ffb02e'/><path d='M10 3.2 15 6 10 8.8 5 6Z' fill='%23c8341f'/></svg>");
  --pill: polygon(11px 0, calc(100% - 11px) 0, 100% 50%, calc(100% - 11px) 100%, 11px 100%, 0 50%);
  --gutter: 20px;
  color-scheme: dark;
}
html[lang="ru"] { --font-display: 'Forum', 'Reem Kufi', 'Palatino Linotype', 'Times New Roman', serif; }
html[lang="zh"] { --font-display: 'Noto Serif SC', 'Songti SC', 'STSong', 'Noto Serif CJK SC', 'SimSun', serif; --font-body: 'Jost', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--horizon); color: var(--text); }
body { font: 400 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; outline: none; background: var(--horizon); touch-action: none; user-select: none; -webkit-user-select: none; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, #app:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; transition: opacity .4s; }
.nohud #hud, .nohud #touch { opacity: 0; }
.nohud #hud *, .nohud #touch * { pointer-events: none !important; }
#speed { position: absolute; left: var(--gutter); bottom: calc(var(--gutter) + 4px); display: flex; align-items: baseline; gap: 8px; text-shadow: 0 1px 14px rgba(14, 18, 52, .55); }
#speedv { font: 500 clamp(34px, 6vw, 54px)/1 var(--font-display); letter-spacing: .02em; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
/* jauge de boost, compteur d'air time, voile de vitesse */
#boostfx { position: absolute; inset: 0; opacity: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 56%, rgba(255, 176, 46, 0) 46%, rgba(255, 150, 40, .22) 78%, rgba(200, 52, 31, .52) 100%); }
#boostfx::before, #boostfx::after { content: ''; position: absolute; left: 0; right: 0; height: 14px; background: var(--loz) repeat-x center / 20px 12px; opacity: .9; }
#boostfx::before { top: 8px; } #boostfx::after { bottom: 8px; }
#boost { position: absolute; left: var(--gutter); bottom: calc(var(--gutter) + 70px); display: flex; align-items: center; gap: 10px; text-shadow: 0 1px 12px rgba(14, 18, 52, .6); transition: opacity .6s; }
#boost .lbl { display: inline-flex; align-items: center; gap: 7px; font: 500 11px/1 var(--font-body); letter-spacing: .22em; text-transform: uppercase; color: var(--text); opacity: .95; }
#boost .lbl::before { content: ''; width: 9px; height: 9px; background: var(--accent); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
#boost .bar { position: relative; width: clamp(120px, 20vw, 190px); height: 16px; background: var(--accent); clip-path: polygon(0 50%, 8px 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 8px 100%); }
#boost .bar::before { content: ''; position: absolute; inset: 2px 3px; background: rgba(12, 16, 48, .86); clip-path: polygon(0 50%, 6px 0, calc(100% - 6px) 0, 100% 50%, calc(100% - 6px) 100%, 6px 100%); }
#boost .bar i { position: absolute; inset: 3px 5px; transform-origin: 0 50%; transform: scaleX(1); background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0) 0 5px, rgba(120, 30, 10, .35) 5px 6px), linear-gradient(90deg, #ff8a2a, #ffd070 72%, #fff1c8); box-shadow: 0 0 12px rgba(255, 190, 90, .8); }
#boost.on .bar i { background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0) 0 5px, rgba(120, 30, 10, .25) 5px 6px), linear-gradient(90deg, #ffc067, #fff0c0 70%, #ffffff); box-shadow: 0 0 18px rgba(255, 226, 150, .95); }
#boost.low .bar i { background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0) 0 5px, rgba(60, 10, 10, .35) 5px 6px), linear-gradient(90deg, #b8301c, #ff7a4a); box-shadow: 0 0 10px rgba(230, 90, 60, .7); }
#boost .gain { min-width: 3.4em; font-size: 13px; font-weight: 500; letter-spacing: .04em; font-variant-numeric: tabular-nums; opacity: 0; transform: translateY(4px); }
#boost .gain.pop { animation: gainpop 1.1s ease-out; }
#boost.pulse .bar { animation: barpulse .6s ease-out; }
@keyframes gainpop { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; transform: translateY(0); } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-4px); } }
@keyframes barpulse { 0% { filter: brightness(1.7) drop-shadow(0 0 6px rgba(255, 226, 170, .9)); } 100% { filter: none; } }
#air { position: absolute; left: 50%; top: 15%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 2 * var(--gutter)); text-align: center; opacity: 0; transition: opacity .35s; text-shadow: 0 0 3px rgba(14, 18, 52, .7), 0 2px 22px rgba(14, 18, 52, .75); pointer-events: none; }
#air.show { opacity: 1; }
#air .k { display: inline-flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--text); opacity: .95; }
#air .k::before, #air .k::after { content: ''; width: 8px; height: 8px; background: var(--accent); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
#air .v { font: 500 clamp(40px, 8vw, 76px)/1.05 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
#air .s { min-height: 1.4em; font-size: 15px; letter-spacing: .08em; color: var(--text); }
#air.rec .v { color: #ffd070; }
#speed small { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--text); opacity: .85; }
#hint { position: absolute; left: 50%; bottom: calc(var(--gutter) + 6px); transform: translateX(-50%); width: max-content; max-width: calc(100% - 2 * var(--gutter) - 120px); text-align: center; font-size: 13px; letter-spacing: .06em; color: var(--text); text-shadow: 0 0 3px rgba(14, 18, 52, .75), 0 1px 14px rgba(14, 18, 52, .8); transition: opacity 1.6s; }
#hint.fade { opacity: 0; }
.intro-on #hint, .intro-on #speed, .intro-on #boost { opacity: 0; }
.intro-on #touch { opacity: 0; pointer-events: none; }
#touch { transition: opacity .6s; }
#speed { transition: opacity .6s; }
#fps { position: absolute; left: var(--gutter); top: var(--gutter); font: 400 12px/1 var(--font-body); letter-spacing: .08em; font-variant-numeric: tabular-nums; color: var(--text-dim); background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px; padding: 6px 10px; }
#gear { position: absolute; right: calc(var(--gutter) + 8px); top: calc(var(--gutter) + 8px); width: 34px; height: 34px; border-radius: 7px; display: grid; place-items: center; background: var(--glass); border: 1.5px solid var(--accent); transform: rotate(45deg); pointer-events: auto; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
#gear:hover { background: var(--glass-strong); }
#gear svg { width: 17px; height: 17px; stroke: var(--text); fill: none; stroke-width: 1.6; stroke-linecap: round; transform: rotate(-45deg); }
#panel { position: absolute; right: var(--gutter); top: calc(var(--gutter) + 62px); width: min(280px, calc(100% - 2 * var(--gutter))); padding: 26px 16px 16px; display: grid; gap: 14px; background: var(--zig) repeat-x center 8px / 24px 10px, var(--glass-strong); border: 1px solid var(--glass-line); border-radius: 6px; pointer-events: auto; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#panel h2 { margin: 0 0 6px; font: 500 11px/1 var(--font-body); letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button, .toggle { position: relative; isolation: isolate; border: 0; background: rgba(255, 212, 140, .55); clip-path: var(--pill); padding: 7px 17px; font-size: 13px; letter-spacing: .04em; }
.chips button::before, .toggle::before { content: ''; position: absolute; inset: 1.5px; z-index: -1; background: rgba(16, 20, 58, .86); clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%); }
.chips button:hover::before, .toggle:hover::before { background: rgba(48, 44, 96, .9); }
.chips button[aria-pressed="true"], .toggle[aria-pressed="true"] { background: var(--accent); color: var(--night); font-weight: 500; }
.chips button[aria-pressed="true"]::before, .toggle[aria-pressed="true"]::before { background: var(--accent); }
.rowt { display: flex; flex-wrap: wrap; gap: 6px; }
#optReset { width: 100%; border: 1px solid var(--glass-line); background: transparent; border-radius: 4px; padding: 9px 12px; font-size: 13px; letter-spacing: .06em; }
#optReset:hover { background: rgba(255, 226, 186, .12); }

/* écran d'accueil */
#intro { position: absolute; inset: 0; display: flex; padding: 24px var(--gutter); background: radial-gradient(ellipse at 50% 52%, rgba(12, 16, 48, .70), rgba(12, 16, 48, .28) 72%); transition: opacity .9s ease; overflow: auto; }
#intro.gone { opacity: 0; pointer-events: none; }
.card { width: min(34rem, 100%); margin: auto; display: grid; gap: clamp(10px, 2.2vh, 20px); justify-items: center; text-align: center; padding-block: 8px; }
.card .chips { justify-content: center; }
.tfng { display: flex; align-items: center; gap: 14px; font: 400 clamp(22px, 4.2vh, 32px)/1 var(--font-tfng); letter-spacing: .32em; text-indent: .32em; color: var(--accent); text-shadow: 0 1px 18px rgba(14, 18, 52, .8); }
.tfng i { position: relative; width: clamp(36px, 12vw, 96px); height: 1px; background: linear-gradient(90deg, transparent, var(--accent)); }
.tfng i:last-child { background: linear-gradient(270deg, transparent, var(--accent)); }
.tfng i::after { content: ''; position: absolute; right: -3px; top: -3px; width: 7px; height: 7px; background: var(--accent); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.tfng i:last-child::after { right: auto; left: -3px; }
.credit { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 13px; letter-spacing: .12em; color: var(--text-dim); }

<script>
/* ===== SIM : terrain analytique + physique de glisse (aucune dépendance) ===== */
const TAU = Math.PI * 2;
const D2R = Math.PI / 180;
const WIND_ANG = 28;
const WIND = { x: Math.cos(WIND_ANG * D2R), z: Math.sin(WIND_ANG * D2R) };

/* Chaque composante est une onde de phase modulée :
   theta = K.p + p0 + wamp*sin(Q.p + p1)            (crêtes qui serpentent)
   theta2 = theta + skew*sin(theta)                  (face sous le vent plus raide)
   profil = sin(theta2)  ou  0.64 - sqrt(sin^2 + sharp) (crête vive, creux large)
   enveloppe = 1 - edep*(0.5 - 0.5*sin(M.p + p2))    (hauteur qui varie d'une dune à l'autre) */
function makeComp(o) {
  const a = o.ang * D2R, k = TAU / o.wl;
  const wa = (o.wang || 0) * D2R, wk = TAU / (o.wwl || 1000);
  const ea = (o.eang || 0) * D2R, ek = TAU / (o.ewl || 1000);
  return {
    kx: Math.cos(a) * k, kz: Math.sin(a) * k, amp: o.amp, skew: o.skew || 0,
    qx: Math.cos(wa) * wk, qz: Math.sin(wa) * wk, wamp: o.wamp || 0, lod: o.lod ? 1 : 0,
    mx: Math.cos(ea) * ek, mz: Math.sin(ea) * ek, edep: o.edep || 0,
    rw: o.rw || 0, sharp: o.sharp || 0.04,
    p0: o.p0 || 0, p1: o.p1 || 0, p2: o.p2 || 0
  };
}
const COMPS = [
  { ang: WIND_ANG,      wl: 132, amp: 5.0, skew: 0.50, rw: 1, sharp: 0.035, wwl: 360, wamp: 2.6, wang: WIND_ANG + 90, ewl: 610, eang: WIND_ANG + 40, edep: 0.50, p0: 0.4, p1: 1.1, p2: 2.0 },
  { ang: WIND_ANG - 24, wl: 78,  amp: 2.2, skew: 0.40, rw: 1, sharp: 0.050, wwl: 210, wamp: 2.0, wang: WIND_ANG + 70, ewl: 340, eang: WIND_ANG + 110, edep: 0.55, p0: 2.2, p1: 0.3, p2: 4.0 },
  { ang: WIND_ANG + 78, wl: 310, amp: 7.0, skew: 0,    rw: 0, wwl: 760, wamp: 1.3, wang: 12,  p0: 1.3, p1: 2.0 },
  { ang: WIND_ANG - 58, wl: 197, amp: 3.6, skew: 0,    rw: 0, wwl: 520, wamp: 2.2, wang: 100, p0: 5.0, p1: 0.7 },
  { ang: WIND_ANG + 8,  wl: 27,  amp: 0.26, skew: 0.25, rw: 0.5, sharp: 0.06, wwl: 80, wamp: 1.8, wang: WIND_ANG + 80, ewl: 120, eang: 20, edep: 0.6, lod: 1, p0: 0.9, p1: 3.0, p2: 1.0 },
  { ang: WIND_ANG + 35, wl: 41,  amp: 0.50, skew: 0,    rw: 0, wwl: 130, wamp: 1.5, wang: 200, lod: 1, p0: 3.3, p1: 5.1 }
].map(makeComp);
const NCOMP = COMPS.length;
const TERRAIN = { amp: 1 };           // échelle globale des dunes (réglable)

/* h + gradient (hauteur en m). lod=1 : tout le détail (physique et zone proche). */
function terrain(x, z, out, lod) {
  if (lod === undefined) lod = 1;
  let h = 0, gx = 0, gz = 0;
  for (let i = 0; i < NCOMP; i++) {
    const c = COMPS[i];
    const amp = c.amp * (c.lod ? lod : 1);
    if (amp < 1e-4) continue;
    const qa = c.qx * x + c.qz * z + c.p1;
    const wq = c.wamp * Math.cos(qa);
    const th = c.kx * x + c.kz * z + c.p0 + c.wamp * Math.sin(qa);
    const dthx = c.kx + wq * c.qx, dthz = c.kz + wq * c.qz;
    const th2 = th + c.skew * Math.sin(th);
    const dth2 = 1 + c.skew * Math.cos(th);
    const sn = Math.sin(th2), cs = Math.cos(th2);
    const r = Math.sqrt(sn * sn + c.sharp);
    const f = (1 - c.rw) * sn + c.rw * (0.64 - r);
    const df = (1 - c.rw) * cs + c.rw * (-sn * cs / r);
    const ea = c.mx * x + c.mz * z + c.p2;
    const E = 1 - c.edep * 0.5 * (1 - Math.sin(ea));
    const dE = c.edep * 0.5 * Math.cos(ea);
    h += amp * E * f;
    gx += amp * (E * df * dth2 * dthx + f * dE * c.mx);
    gz += amp * (E * df * dth2 * dthz + f * dE * c.mz);
  }
  out.h = h * TERRAIN.amp; out.gx = gx * TERRAIN.amp; out.gz = gz * TERRAIN.amp;
  return out;
}
function heightAt(x, z) { return terrain(x, z, _t0).h; }
const _t0 = { h: 0, gx: 0, gz: 0 }, _t1 = { h: 0, gx: 0, gz: 0 };

/* Phases à envoyer au GPU : le shader travaille en coordonnées locales (autour du joueur)
   et reçoit (K.c + p0) mod 2pi calculé ici en double -> aucune perte de précision, même très loin. */
function terrainPhases(cx, cz, outArr) {
  for (let i = 0; i < NCOMP; i++) {
    const c = COMPS[i];
    outArr[i * 4 + 0] = mod2pi(c.kx * cx + c.kz * cz + c.p0);
    outArr[i * 4 + 1] = mod2pi(c.qx * cx + c.qz * cz + c.p1);
    outArr[i * 4 + 2] = mod2pi(c.mx * cx + c.mz * cz + c.p2);
    outArr[i * 4 + 3] = c.sharp;
  }
}
function mod2pi(v) { v = v % TAU; return v < 0 ? v + TAU : v; }

/* ---------------- Physique ---------------- */
const PHYS = {
  G: 11.0,            // gravité (m/s²)
  mu: 0.03,           // friction de glisse
  drag: 0.0008,       // traînée de l'air (quadratique)
  grip: 4.2,          // adhérence latérale (arête de la planche)
  push: 14.0,         // poussée en pédalant (m/s²)
  pushMax: 28.0,      // vitesse au-delà de laquelle la poussée s'éteint
  turn: 3.0,          // vitesse de rotation (rad/s)
  turnSpd: 0.03,      // le virage se durcit avec la vitesse
  jumpMin: 6.5,       // saut tapé (m/s)
  jumpMax: 13.5,      // saut chargé à fond (m/s)
  chargeTime: 0.55,   // durée de charge complète (s)
  maxSpeed: 70,       // plafond « doux » sans boost (m/s)
  boostSpeedK: 1.4,   // le boost relève le plafond de 40 %
  boostAccel: 26,     // poussée du boost (m/s²)
  boostDrain: 0.24,   // énergie consommée par seconde (1 = jauge pleine)
  boostRegen: 0.07,   // énergie rendue par seconde…
  boostDelay: 1.4,    // …après ce délai sans boost (s)
  boostMin: 0.12,     // énergie minimale pour relancer après épuisement
  stick: 14,          // aspiration au sol : lisse les petites bosses, laisse décoller les crêtes (m/s²)
  stickH: 0.4         // hauteur sous laquelle l'aspiration agit (m)
};

function newPlayer() {
  return {
    x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, h: 0,
    grounded: true, coyote: 0.1, airTime: 0,
    tuck: 0, steer: 0,
    nx: 0, ny: 1, nz: 0,
    speed: 0, vf: 0, slip: 0, landImpact: 0, jumped: false, _jumpHeld: false,
    charge: 0, noStick: 0, jumpPower: 0,
    energy: 1, boosting: false, boostK: 0, boostLock: false, sinceBoost: 9,
    apex: 0, lastAir: 0, lastApex: 0, landEvt: false
  };
}

function wrapPI(a) { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; }

function placeOnCrest(s, cx, cz, prefX, prefZ) {
  /* point haut proche, pente modérée, dont la descente regarde (prefX, prefZ) si fourni */
  let best = -1e9, bx = cx, bz = cz;
  for (let r = 0; r <= 120; r += 4) {
    for (let a = 0; a < TAU; a += Math.PI / 18) {
      const px = cx + Math.cos(a) * r, pz = cz + Math.sin(a) * r;
      terrain(px, pz, _t0);
      const g = Math.hypot(_t0.gx, _t0.gz);
      let score = _t0.h - r * 0.03;
      if (g < 0.14 || g > 0.5) score -= 6;
      if (prefX !== undefined) score += 9 * ((-_t0.gx * prefX - _t0.gz * prefZ) / (g || 1));
      if (score > best) { best = score; bx = px; bz = pz; }
    }
  }
  terrain(bx, bz, _t0);
  s.x = bx; s.z = bz; s.y = _t0.h + 0.001;
  s.vx = s.vy = s.vz = 0;
  s.h = Math.atan2(-_t0.gx, -_t0.gz);
  s.grounded = true; s.coyote = 0.1; s.airTime = 0; s.tuck = 0; s.steer = 0;
  s.charge = 0; s.noStick = 0; s.boosting = false; s.boostK = 0; s.boostLock = false; s.sinceBoost = 9; s.apex = 0; s.landEvt = false;
  { const l = Math.hypot(_t0.gx, 1, _t0.gz); s.nx = -_t0.gx / l; s.ny = 1 / l; s.nz = -_t0.gz / l; }
  return s;
}

function stepPlayer(s, inp, dt) {
  const G = PHYS.G;
  terrain(s.x, s.z, _t1);
  let nx = -_t1.gx, ny = 1, nz = -_t1.gz;
  const nl = Math.hypot(nx, ny, nz); nx /= nl; ny /= nl; nz /= nl;
  const height = s.y - _t1.h;
  const touching = height < 0.05;
  s.coyote = touching ? 0.1 : Math.max(0, s.coyote - dt);
  const ctl = s.coyote > 0;
  s.noStick = Math.max(0, s.noStick - dt);

  /* entrées lissées */
  s.steer += (inp.steer - s.steer) * (1 - Math.exp(-10 * dt));
  s.tuck += ((inp.tuck ? 1 : 0) - s.tuck) * (1 - Math.exp(-7 * dt));
  const brake = inp.brake ? 1 : 0;

  /* boost : consomme l'énergie, se recharge avec le temps, se verrouille à l'épuisement */
  if (s.boostLock && s.energy >= PHYS.boostMin) s.boostLock = false;
  const boostOn = !!inp.boost && s.energy > 0 && !s.boostLock;
  if (boostOn) {
    s.energy = Math.max(0, s.energy - PHYS.boostDrain * dt);
    s.sinceBoost = 0;
    if (s.energy <= 0) s.boostLock = true;
  } else {
    s.sinceBoost += dt;
    if (s.sinceBoost > PHYS.boostDelay) s.energy = Math.min(1, s.energy + PHYS.boostRegen * dt);
  }
  s.boosting = boostOn;
  s.boostK += ((boostOn ? 1 : 0) - s.boostK) * (1 - Math.exp(-9 * dt));

  /* cap */
  const sp0 = Math.hypot(s.vx, s.vy, s.vz);
  const hs0 = Math.hypot(s.vx, s.vz);
  const turnRate = PHYS.turn / (1 + PHYS.turnSpd * sp0);
  s.h -= s.steer * turnRate * (ctl ? 1 : 0.55) * dt;
  if (ctl && hs0 > 3 && Math.abs(s.steer) < 0.15) {
    const diff = wrapPI(Math.atan2(s.vx, s.vz) - s.h);
    if (Math.abs(diff) < 1.9) s.h += diff * (1 - Math.exp(-1.3 * dt));
  }
  const fx = Math.sin(s.h), fz = Math.cos(s.h);

  /* traînée + gravité */
  const cd = PHYS.drag * (1 - 0.5 * s.tuck);
  const dk = Math.max(0, 1 - cd * sp0 * dt);
  s.vx *= dk; s.vy *= dk; s.vz *= dk;
  s.vy -= G * dt;

  /* saut chargé : on maintient pour charger, on relâche pour décoller */
  let doJump = false;
  if (inp.jump && ctl) s.charge = Math.min(1, s.charge + dt / PHYS.chargeTime);
  else if (!inp.jump && s._jumpHeld && s.charge > 0 && ctl) doJump = true;
  else if (!ctl || !inp.jump) s.charge = 0;
  const jumpV = PHYS.jumpMin + (PHYS.jumpMax - PHYS.jumpMin) * s.charge;

  /* forces de contact (sur le sable) */
  s.slip = 0; s.vf = 0;
  if (touching) {
    let vn = s.vx * nx + s.vy * ny + s.vz * nz;
    /* aspiration : la planche « colle » au sable sur les petites bosses mais lâche sur les vraies crêtes */
    if (s.noStick <= 0 && vn > 0) vn = Math.max(0, vn - PHYS.stick * dt);
    const vnx = nx * vn, vny = ny * vn, vnz = nz * vn;
    let tx = s.vx - nx * (s.vx * nx + s.vy * ny + s.vz * nz), ty = s.vy - ny * (s.vx * nx + s.vy * ny + s.vz * nz), tz = s.vz - nz * (s.vx * nx + s.vy * ny + s.vz * nz);
    /* friction */
    const mu = PHYS.mu * (1 - 0.4 * s.tuck) + brake * 0.42;
    const vtl = Math.hypot(tx, ty, tz);
    if (vtl > 1e-5) {
      const k = Math.max(0, 1 - (mu * G * ny * dt) / vtl);
      tx *= k; ty *= k; tz *= k;
    }
    /* repère local : avant / droite dans le plan tangent */
    let ax = fx - nx * (fx * nx + fz * nz), ay = -ny * (fx * nx + fz * nz), az = fz - nz * (fx * nx + fz * nz);
    const al = Math.hypot(ax, ay, az) || 1; ax /= al; ay /= al; az /= al;
    const rx = ay * nz - az * ny, ry = az * nx - ax * nz, rz = ax * ny - ay * nx;   // cross(f, n) = droite
    let vf = tx * ax + ty * ay + tz * az;
    let vs = tx * rx + ty * ry + tz * rz;
    /* adhérence : l'énergie latérale retirée est en partie redonnée à l'avance (virage taillé) */
    const grip = PHYS.grip * (1 - 0.3 * s.tuck) + brake * 5.0;
    const kk = 1 - Math.exp(-grip * dt);
    const vs2 = vs * (1 - kk);
    const dEs = vs * vs - vs2 * vs2;
    const vf2 = Math.sqrt(Math.max(0, vf * vf + 0.45 * dEs)) * (vf < 0 ? -1 : 1);
    vf = vf2; vs = vs2;
    /* poussée */
    if (inp.push > 0 && s.tuck < 0.5) {
      const pf = Math.min(1, Math.max(0, 1 - vf / PHYS.pushMax));
      vf += PHYS.push * pf * inp.push * dt;
    }
    /* boost : poussée forte, jamais limitée par pushMax (c'est le plafond doux qui la borne) */
    if (s.boostK > 0.01) vf += PHYS.boostAccel * s.boostK * dt;
    s.vf = vf; s.slip = Math.abs(vs);
    s.vx = ax * vf + rx * vs + vnx;
    s.vy = ay * vf + ry * vs + vny;
    s.vz = az * vf + rz * vs + vnz;
    if (doJump) {
      s.vx += nx * jumpV; s.vy += ny * jumpV; s.vz += nz * jumpV;
      s.coyote = 0; s.jumped = true; s.jumpPower = jumpV; s.charge = 0; s.noStick = 0.4;
    }
  } else {
    if (doJump) {                                     // saut « coyote » juste après avoir quitté la crête
      s.vy += jumpV; s.coyote = 0; s.jumped = true; s.jumpPower = jumpV; s.charge = 0; s.noStick = 0.4;
    } else if (height < PHYS.stickH && s.noStick <= 0) {
      const vn = s.vx * nx + s.vy * ny + s.vz * nz;   // petit décollage : la planche est rappelée vers le sable
      if (vn > 0) { const d = Math.min(vn, PHYS.stick * dt); s.vx -= nx * d; s.vy -= ny * d; s.vz -= nz * d; }
    }
    if (s.boostK > 0.01) { const a = PHYS.boostAccel * 0.35 * s.boostK * dt; s.vx += fx * a; s.vz += fz * a; }
  }
  s._jumpHeld = !!inp.jump;

  /* plafond de vitesse doux (le boost le relève) ; butée dure pour la sécurité */
  const cap = PHYS.maxSpeed * (1 + (PHYS.boostSpeedK - 1) * s.boostK);
  const sp = Math.hypot(s.vx, s.vy, s.vz);
  if (sp > cap) { const k = 1 - ((sp - cap) / sp) * (1 - Math.exp(-2.5 * dt)); s.vx *= k; s.vy *= k; s.vz *= k; }
  const hard = PHYS.maxSpeed * PHYS.boostSpeedK * 1.2;
  if (sp > hard) { const k = hard / sp; s.vx *= k; s.vy *= k; s.vz *= k; }

  /* intégration */
  s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;

  /* collision avec le sable */
  terrain(s.x, s.z, _t1);
  let mx = -_t1.gx, my = 1, mz = -_t1.gz;
  const ml = Math.hypot(mx, my, mz); mx /= ml; my /= ml; mz /= ml;
  let contact = false;
  if (s.y <= _t1.h) {
    const vn = s.vx * mx + s.vy * my + s.vz * mz;
    if (vn < 0) {
      s.vx -= mx * vn; s.vy -= my * vn; s.vz -= mz * vn;
      const imp = -vn;
      if (!s.grounded && imp > 2.5) s.landImpact = Math.max(s.landImpact, imp);
      if (imp > 3) { const k = Math.max(0.75, 1 - 0.012 * imp); s.vx *= k; s.vy *= k; s.vz *= k; }
    }
    s.y = _t1.h; contact = true;
  } else if (s.y - _t1.h < 0.02) contact = true;
  if (!contact) s.apex = Math.max(s.apex, s.y - _t1.h);
  if (contact && !s.grounded) { s.lastAir = s.airTime; s.lastApex = s.apex; s.apex = 0; s.landEvt = true; }
  s.nx = mx; s.ny = my; s.nz = mz;
  s.grounded = contact;
  s.airTime = contact ? 0 : s.airTime + dt;
  s.speed = Math.hypot(s.vx, s.vy, s.vz);
}

/* ===== SHADERS (GLSL) — le même terrain que sim.js, évalué sur le GPU ===== */
const RIPPLE = { kr: 12.5, w1: [0.41, -0.19], w2: [-0.21, 0.63], w3: [0.07, 0.11], pw1: [0.067, 0.031], pw2: [-0.041, 0.093], cellScale: 60 };
const V2 = (a) => `vec2(${a[0].toFixed(4)}, ${a[1].toFixed(4)})`;

const GLSL_TERRAIN = `
uniform vec4 uK[${NCOMP}];
uniform vec4 uQ[${NCOMP}];
uniform vec4 uM[${NCOMP}];
uniform vec4 uP[${NCOMP}];
uniform float uAmp;
vec3 terrain(vec2 p, float lod) {
  float h = 0.0; vec2 g = vec2(0.0);
  float farK = 0.16 * smoothstep(90.0, 320.0, length(p));
  for (int i = 0; i < ${NCOMP}; i++) {
    vec4 K = uK[i]; vec4 Q = uQ[i]; vec4 M = uM[i]; vec4 P = uP[i];
    float amp = K.z * mix(1.0, lod, Q.w);
    float qa = dot(Q.xy, p) + P.y;
    float wq = Q.z * cos(qa);
    float th = dot(K.xy, p) + P.x + Q.z * sin(qa);
    vec2 dth = K.xy + wq * Q.xy;
    float th2 = th + K.w * sin(th);
    float dth2 = 1.0 + K.w * cos(th);
    float sn = sin(th2); float cs = cos(th2);
    float r = sqrt(sn * sn + P.w + farK * M.w);
    float f = mix(sn, 0.64 - r, M.w);
    float df = mix(cs, -sn * cs / r, M.w);
    float ea = dot(M.xy, p) + P.z;
    float E = 1.0 - M.z * 0.5 * (1.0 - sin(ea));
    float dE = M.z * 0.5 * cos(ea);
    h += amp * E * f;
    g += amp * (E * df * dth2 * dth + f * dE * M.xy);
  }
  return vec3(h, g) * uAmp;
}
float heightBig(vec2 p) {
  float h = 0.0;
  for (int i = 0; i < 4; i++) {
    vec4 K = uK[i]; vec4 Q = uQ[i]; vec4 M = uM[i]; vec4 P = uP[i];
    float th = dot(K.xy, p) + P.x + Q.z * sin(dot(Q.xy, p) + P.y);
    float sn = sin(th + K.w * sin(th));
    float f = mix(sn, 0.64 - sqrt(sn * sn + P.w), M.w);
    h += K.z * (1.0 - M.z * 0.5 * (1.0 - sin(dot(M.xy, p) + P.z))) * f;
  }
  return h * uAmp;
}
`;

const GLSL_SKY = `
uniform vec3 uSun;
vec3 skyBase(vec3 d) {
  float e = max(d.y, 0.0);
  vec3 c = vec3(1.00, 0.72, 0.46);
  c = mix(c, vec3(0.96, 0.52, 0.45), smoothstep(0.0, 0.10, e));
  c = mix(c, vec3(0.62, 0.50, 0.66), smoothstep(0.07, 0.30, e));
  c = mix(c, vec3(0.25, 0.46, 0.66), smoothstep(0.22, 0.56, e));
  c = mix(c, vec3(0.07, 0.17, 0.44), smoothstep(0.48, 1.00, e));
  float az = dot(normalize(d.xz + vec2(1e-5)), normalize(uSun.xz)) * 0.5 + 0.5;
  c *= mix(vec3(0.84, 0.80, 0.94), vec3(1.0), mix(az, 1.0, smoothstep(0.0, 0.6, e)));
  float sd = max(dot(d, uSun), 0.0);
  c += vec3(1.00, 0.56, 0.24) * pow(sd, 5.0) * 0.24;
  c += vec3(1.00, 0.78, 0.46) * pow(sd, 40.0) * 0.42;
  return c;
}
vec3 skyFull(vec3 d) {
  vec3 c = skyBase(d);
  float sd = dot(d, uSun);
  c = mix(c, vec3(1.0, 0.95, 0.80) * 1.5, smoothstep(0.99955, 0.99985, sd));
  if (d.y > 0.03) {
    vec2 uv = d.xz / (d.y + 0.30) * 1.3;
    float w = sin(uv.x * 1.7 + 1.3 * sin(uv.y * 0.9 + 0.7)) * 0.5 + 0.5;
    float s2 = sin(uv.y * 5.5 + uv.x * 0.8 + 2.0 * sin(uv.x * 1.3)) * 0.5 + 0.5;
    float cl = smoothstep(0.50, 0.95, w * s2) * smoothstep(0.04, 0.30, d.y) * (1.0 - smoothstep(0.65, 1.0, d.y));
    vec3 cc = mix(vec3(1.0, 0.72, 0.58), vec3(1.0, 0.90, 0.78), smoothstep(0.1, 0.5, d.y));
    c = mix(c, cc, cl * 0.30);
  }
  return c;
}
vec3 tone(vec3 c) { vec3 hi = max(c - 0.74, 0.0); return min(c, vec3(0.74)) + 0.26 * (1.0 - exp(-hi / 0.26)); }
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
`;

/* ---- terrain ---- */
const VS_TERRAIN = `
${GLSL_TERRAIN}
uniform vec2 uSun2D; uniform float uSunTan;
varying vec2 vL; varying vec2 vG; varying float vH; varying float vSh;
void main() {
  vec2 p = position.xz;
  float lod = 1.0 - smoothstep(35.0, 140.0, length(p));
  vec3 t = terrain(p, lod);
  vL = p; vG = t.yz; vH = t.x;
  float sh = 1.0;
#if SH_STEPS > 0
  for (int i = 0; i < SH_STEPS; i++) {
    float dd = 2.0 * exp2(float(i));
    float hs = heightBig(p + uSun2D * dd);
    float pw = 0.35 + 0.05 * dd;
    float occ = smoothstep(-pw, pw, hs - (t.x + dd * uSunTan - 0.1));
    sh = min(sh, 1.0 - occ);
  }
#endif
  vSh = sh;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p.x, t.x, p.y, 1.0);
}`;

const FS_TERRAIN = `
${GLSL_SKY}
uniform float uTime; uniform vec2 uSun2D;
uniform vec3 uCamLocal;
uniform vec4 uRP; uniform vec2 uPP; uniform vec2 uCell;
uniform float uShAmt; uniform float uShOff; uniform float uShLen;
uniform float uFogD; uniform float uFar;
varying vec2 vL; varying vec2 vG; varying float vH; varying float vSh;
const vec2 WINDV = vec2(${WIND.x.toFixed(5)}, ${WIND.z.toFixed(5)});
const vec2 RW0 = WINDV * ${RIPPLE.kr.toFixed(3)};
const vec2 RW1 = ${V2(RIPPLE.w1)};
const vec2 RW2 = ${V2(RIPPLE.w2)};
const vec2 RW3 = ${V2(RIPPLE.w3)};
const vec2 PW1 = ${V2(RIPPLE.pw1)};
const vec2 PW2 = ${V2(RIPPLE.pw2)};
vec3 ramp(float t) {
  vec3 c = mix(vec3(0.07, 0.11, 0.30), vec3(0.24, 0.20, 0.46), smoothstep(0.0, 0.36, t));
  c = mix(c, vec3(0.80, 0.31, 0.20), smoothstep(0.34, 0.50, t));
  c = mix(c, vec3(0.99, 0.55, 0.22), smoothstep(0.48, 0.64, t));
  c = mix(c, vec3(1.00, 0.76, 0.34), smoothstep(0.62, 1.00, t));
  return c;
}
void main() {
  vec3 wp = vec3(vL.x, vH, vL.y);
  vec3 toC = uCamLocal - wp;
  float dist = length(toC);
  vec3 V = toC / dist;
  vec3 N = normalize(vec3(-vG.x, 1.0, -vG.y));
  vec3 Nf = normalize(cross(dFdx(wp), dFdy(wp)));
  if (Nf.y < 0.0) Nf = -Nf;
  N = normalize(mix(N, Nf, smoothstep(70.0, 240.0, dist)));
  float slope = length(vG);
  float alongW = dot(vG, WINDV);

#ifdef RIPPLE
  float rf = 1.0 - smoothstep(14.0, 70.0, dist);
  if (rf > 0.001) {
    float ph = dot(vL, RW0) + uRP.x + 1.6 * sin(dot(vL, RW1) + uRP.y) + 0.8 * sin(dot(vL, RW2) + uRP.z);
    float mask = 0.5 + 0.5 * sin(dot(vL, RW3) + uRP.w) * sin(dot(vL, RW2 * 1.7 + RW1) + uRP.x * 0.5);
    float wm = smoothstep(-0.30, 0.05, alongW) * (1.0 - 0.6 * smoothstep(0.45, 0.8, slope));
    vec2 dn = WINDV * (0.115 * rf * mask * mask * wm * cos(ph));
    N = normalize(vec3(-vG.x - dn.x, 1.0, -vG.y - dn.y));
  }
#endif

  float nl = dot(N, uSun);
  float t = clamp(0.5 + nl * 0.55, 0.0, 1.0);
  float ts = 0.10 + 0.20 * smoothstep(0.0, 0.9, t);
  float lit = vSh;
  t = mix(ts, t, lit);
  vec3 col = ramp(t);

  col *= mix(0.84, 1.0, smoothstep(-9.0, 5.0, vH));
  float pa = sin(dot(vL, PW1) + uPP.x) * 0.5 + sin(dot(vL, PW2) + uPP.y) * 0.5;
  col *= vec3(1.0 + 0.035 * pa, 1.0, 1.0 - 0.05 * pa);

  /* liseré de lumière sur les arêtes tournées à l'opposé de la caméra */
  float ndv = max(dot(N, V), 0.0);
  float rim = pow(clamp(1.0 - ndv, 0.0, 1.0), 5.0);
  col += vec3(1.0, 0.72, 0.42) * rim * lit * 0.55 * smoothstep(-0.1, 0.5, nl);

  /* paillettes de sable */
#ifdef GLITTER
  {
    float gf = 1.0 - smoothstep(6.0, 40.0, dist);
    if (gf > 0.001) {
      vec2 ci = mod(floor(vL * ${RIPPLE.cellScale.toFixed(1)} + uCell), 4096.0);
      float r1 = hash12(ci); float r2 = hash12(ci + 17.3); float r3 = hash12(ci + 41.7);
      if (r1 > 0.955) {
        vec3 gn = normalize(N + (vec3(r2, r3 * 0.6, r1 * 5.0 - 4.0) - vec3(0.5, 0.3, 0.5)) * 1.3);
        vec3 H = normalize(uSun + V);
        float s = pow(max(dot(gn, H), 0.0), 120.0);
        col += vec3(1.0, 0.86, 0.58) * s * 1.5 * gf * lit;
      }
    }
  }
#endif

  /* ombre portée du personnage */
  vec2 sd = uSun2D;
  vec2 d = vL + sd * (uShLen * 0.5 + uShOff);
  float a = dot(d, sd) / (uShLen * 0.5);
  float b = dot(d, vec2(-sd.y, sd.x)) / 0.40;
  float ps = (1.0 - smoothstep(0.55, 1.0, length(vec2(a, b)))) * uShAmt;
  col = mix(col, col * vec3(0.46, 0.46, 0.76), ps * (0.35 + 0.65 * lit));

  /* brume atmosphérique = couleur de l'horizon dans cette direction */
  vec3 vd = -V;
  float fg = 1.0 - exp(-pow(dist * uFogD, 1.35));
  fg = max(fg, smoothstep(uFar * 0.78, uFar, dist));
  col = mix(col, skyBase(vd), fg);

  col = tone(col) + (hash12(gl_FragCoord.xy + fract(uTime)) - 0.5) / 255.0;
  gl_FragColor = vec4(col, 1.0);
}`;

/* ---- ciel (triangle plein écran, profondeur = 1 : ne se dessine que là où il n'y a pas de sable) ---- */

void main() { vN = position.xy; gl_Position = vec4(position.xy, 1.0, 1.0); }`;
const FS_SKY = `
${GLSL_SKY}

${GLSL_TERRAIN}
attribute vec3 aR;
uniform float uTime; uniform vec2 uWindMove; uniform vec2 uCM; uniform float uPx; uniform float uBox;
varying float vA;
void main() {

  vec4 mvp = modelViewMatrix * vec4(l.x, y, l.y, 1.0);
  float dist = max(-mvp.z, 1.0);

/* ---- gerbes de sable ---- */
const VS_SPRAY = `
attribute float aSize; attribute float aAlpha; attribute float aTint;
uniform float uPx;
varying float vA; varying float vT;

const FS_SPRAY = `

    }
    gl_FragColor = vec4(pal, m * clamp(vA * 1.3, 0.0, 1.0));
    return;
  }
  float r = length(c) * 2.0;
  float a = pow(1.0 - smoothstep(0.0, 1.0, r), 2.0) * vA;
  vec3 col = mix(vec3(0.78, 0.40, 0.30), vec3(1.0, 0.76, 0.40), vT);
  gl_FragColor = vec4(col, a);
}`;

/* ---- orbes de recharge : sphère lumineuse à étoile, chaude au sol et bleue en altitude ---- */
const VS_ORB = `
attribute float aType; attribute float aPh;
uniform float uTime; uniform float uPx;
varying float vA; varying float vT; varying float vPh;
void main() {
  vec3 p = position;
  p.y += sin(uTime * 1.7 + aPh * 6.2831) * 0.22;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  float dist = max(-mv.z, 0.5);
  float pulse = 1.0 + 0.10 * sin(uTime * 3.1 + aPh * 21.0);
  float diam = mix(1.5, 2.1, aType) * pulse;
  gl_PointSize = clamp(diam * uPx / dist, 7.0, 260.0);
  vA = (1.0 - smoothstep(210.0, 300.0, dist)) * smoothstep(1.2, 3.5, dist);
  vT = aType; vPh = aPh;
  gl_Position = projectionMatrix * mv;
}`;
const FS_ORB = `
uniform float uTime;
varying float vA; varying float vT; varying float vPh;
void main() {
  vec2 c = (gl_PointCoord - 0.5) * 2.0;
  float r = length(c);
  float ang = uTime * 0.55 + vPh * 6.2831, cs = cos(ang), sn = sin(ang);
  vec2 q = vec2(cs * c.x - sn * c.y, sn * c.x + cs * c.y);
  float l1 = abs(q.x) + abs(q.y), li = max(abs(q.x), abs(q.y));
  float star = 1.0 - smoothstep(0.0, 0.05, min(li - 0.30, l1 - 0.43));
  float ring = (1.0 - smoothstep(0.0, 0.05, abs(l1 - 0.60) - 0.025)) * 0.85;
  float core = 1.0 - smoothstep(0.0, 0.16, r);
  float halo = pow(max(0.0, 1.0 - r), 2.2);
  float rays = (1.0 - smoothstep(0.0, 0.04, abs(c.x))) * (1.0 - smoothstep(0.0, 0.9, abs(c.y)))
             + (1.0 - smoothstep(0.0, 0.04, abs(c.y))) * (1.0 - smoothstep(0.0, 0.9, abs(c.x)));
  rays *= 0.35 + 0.35 * sin(uTime * 2.3 + vPh * 30.0);
  vec3 warm = mix(vec3(1.0, 0.62, 0.16), vec3(1.0, 0.95, 0.78), core);
  vec3 cool = mix(vec3(0.10, 0.74, 0.78), vec3(0.86, 1.0, 1.0), core);
  vec3 col = mix(warm, cool, vT);
  float a = clamp(star * 0.95 + ring * 0.7 + core + halo * 0.55 + rays * 0.5, 0.0, 1.0) * vA;
  gl_FragColor = vec4(col * (0.85 + 0.8 * star + 0.5 * core), a);
}`;

/* ---- colonne de lumière au-dessus de chaque orbe (visible de loin, orientée vers la caméra) ---- */

const FS_PILLAR = `

/* ---- tapis tissé (motifs inspirés des tapis de Taznakht : losanges emboîtés, bordure en zigzag, franges) ---- */
const VS_CARPET = `
uniform float uTime; uniform float uSp; uniform float uBoost;
varying vec2 vUV; varying vec3 vN; varying vec3 vP;
const vec2 HS = vec2(0.62, 1.05);
float bend(vec2 q) {
  float v = q.y / HS.y, u = q.x / HS.x, av = abs(v);
  float edge = smoothstep(0.2, 1.25, av);
  float fl = sin(q.y * 5.0 - uTime * (4.0 + uSp * 10.0) + q.x * 2.3) * (0.010 + 0.030 * uSp + 0.028 * uBoost) * edge;
  fl += sin(q.y * 9.0 - uTime * (7.0 + uSp * 12.0) - q.x * 3.1) * 0.006 * edge * (0.4 + uSp);
  float lift = 0.17 * smoothstep(0.3, 1.2, v) * (0.30 + 0.70 * uSp);
  float curl = 0.05 * u * u * (0.35 + 0.65 * smoothstep(0.0, 1.2, av));
  float droop = -0.07 * smoothstep(0.6, 1.2, -v) * (1.0 - 0.5 * uSp);
  float fr = smoothstep(1.0, 1.2, av);
  return fl + lift + curl + droop - fr * 0.10 + fr * sin(uTime * 9.0 + q.x * 14.0) * 0.012 * (0.5 + uSp);
}
void main() {
  vec2 q = position.xz;
  vec3 p = vec3(q.x, position.y + bend(q), q.y);
  float e = 0.03;
  float dx = bend(q + vec2(e, 0.0)) - bend(q - vec2(e, 0.0));
  float dz = bend(q + vec2(0.0, e)) - bend(q - vec2(0.0, e));
  vUV = vec2(q.x / HS.x, q.y / HS.y);
  vN = normalMatrix * normalize(vec3(-dx, 2.0 * e, -dz));
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  vP = mv.xyz;
  gl_Position = projectionMatrix * mv;
}`;
const FS_CARPET = `
uniform vec3 uSunV; uniform float uTime; uniform float uBoost; uniform float uSp;
varying vec2 vUV; varying vec3 vN; varying vec3 vP;
float h21(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
const vec3 RED = vec3(0.60, 0.10, 0.08), DRED = vec3(0.34, 0.05, 0.07), IVO = vec3(0.96, 0.87, 0.68);
const vec3 IND = vec3(0.06, 0.08, 0.27), SAF = vec3(0.99, 0.67, 0.16), ORG = vec3(0.92, 0.38, 0.12), TEAL = vec3(0.08, 0.46, 0.50);
void main() {
  float av = abs(vUV.y);
  vec3 col; float gold = 0.0;
  if (av > 1.0) {
    /* franges : un nœud plein, puis des brins qui s'effilent */
    float k = (av - 1.0) / 0.2;
    float fx = vUV.x * 13.0, f = abs(fract(fx) - 0.5);
    if (k > 0.16 && f > 0.19 * (1.0 - 0.55 * k)) discard;
    col = IVO * (0.80 + 0.2 * h21(vec2(floor(fx), 2.0))); gold = 0.7;
  } else {
    vec2 g = vec2(vUV.x * 11.0, vUV.y * 21.0);
    vec2 c = floor(g), f = fract(g);
    vec2 qc = abs(c + 0.5);
    float dx = 11.0 - qc.x, dy = 21.0 - qc.y, d = min(dx, dy);
    col = RED * (1.0 + (h21(vec2(floor(g.y * 0.5), 3.0)) - 0.5) * 0.22);
    if (d < 1.0) { col = IND; }
    else if (d < 2.0) { col = SAF; gold = 1.0; }
    else if (d < 4.6) {
      float s = dx < dy ? c.y : c.x, r = floor(d) - 2.0, pz = abs(mod(s, 4.0) - 2.0);
      col = DRED * 1.15;
      if (abs(r - pz) < 0.5) { col = IVO; gold = 0.8; }
      else if (abs(r - pz - 1.0) < 0.5) col = IND;
    }
    else if (d < 5.6) { col = IVO; gold = 0.6; }
    else {
      float yc = c.y + 0.5, xc = c.x + 0.5;
      float cy = clamp(floor(yc / 10.4 + 0.5), -1.0, 1.0) * 10.4;
      float m = abs(xc) + abs(yc - cy);
      float alt = mod(abs(floor(yc / 10.4 + 0.5)), 2.0);
      if (m < 5.0) {
        if (m < 1.0) { col = IVO; gold = 1.0; }
        else if (m < 2.0) col = IND;
        else if (m < 3.0) { col = mix(SAF, ORG, alt); gold = 1.0 - alt * 0.4; }
        else if (m < 4.0) col = mix(DRED, TEAL, alt * 0.9);
        else { col = mix(IVO, SAF, alt); gold = 0.9; }
      } else if (mod(c.x + c.y, 2.0) < 1.0 && m < 9.0) { col = ORG * 0.95; }
    }
    float wv = 1.0 - smoothstep(0.35, 1.2, fwidth(g.y));
    col *= 1.0 - wv * (0.16 * smoothstep(0.36, 0.5, abs(f.y - 0.5)) + 0.07 * smoothstep(0.38, 0.5, abs(f.x - 0.5)));
    col *= 0.93 + 0.14 * h21(c);
  }
  vec3 N = normalize(vN); if (!gl_FrontFacing) { N = -N; col = DRED * 0.9; gold = 0.0; }
  vec3 V = normalize(-vP);
  float t = clamp(0.5 + dot(N, uSunV) * 0.62, 0.0, 1.0);
  vec3 shadow = col * vec3(0.55, 0.50, 0.90) + vec3(0.03, 0.02, 0.08);
  vec3 lit = col * vec3(1.22, 1.04, 0.86) + vec3(0.07, 0.03, 0.0);
  col = mix(shadow, lit, smoothstep(0.2, 0.85, t));
  col += vec3(1.0, 0.70, 0.40) * pow(1.0 - max(dot(N, V), 0.0), 2.8) * 0.30;
  col += vec3(1.0, 0.72, 0.26) * uBoost * gold * (0.55 + 0.45 * sin(vUV.y * 7.0 + uTime * 16.0)) * 0.85;
  gl_FragColor = vec4(col, 1.0);
}`;

/* ---- étoffes de la voyageuse : soie brodée, cape de nuit étoilée, voile à paillettes, argent, tissus qui flottent au vent ----
   uP = (motif, a, b, c) : 0 laine unie · 1 liseré en zigzag sous y=a · 2 ceinture rayée · 3 plis de turban
   4 cape (ancien) · 5 argent · 6 pan flottant rayé · 7 étoffe de nuit étoilée · 8 voile à paillettes (translucide)
   9 soie brodée à l'ourlet · 10 corsage · 11 tresse · 12 satin · 13 peau ombrée par la capuche
   uF = (mode, longueur, phase, y0) : mode 1 = pan qui file (drapeau) · 2 = étoffe souple (jupe, cape) · 3 = manche
   uW = (force du soulèvement, force des plis) */
const VS_CLOTH = `
uniform float uTime; uniform float uSp; uniform float uBoost; uniform vec4 uF; uniform vec2 uW;
varying vec3 vN; varying vec3 vP; varying vec3 vO; varying vec2 vK; varying vec2 vUV;
void main() {
  vec3 p = position; vec3 n = normal;
  float k = 0.0;
  if (uF.x > 0.5) {
    k = clamp((uF.w - position.y) / uF.y, 0.0, 1.0);
    float sf = clamp(uSp + uBoost * 0.35, 0.0, 1.0) * smoothstep(0.0, 0.5, k);
    if (uF.x < 1.5) {
      float yn = uF.w + (position.y - uF.w) * (1.0 - 0.9 * sf);
      p.z -= (yn - position.y) + 0.10 * k * k;
      p.y = yn;
      float ph = k * 9.0 - uTime * (8.0 + uSp * 16.0) + uF.z;
      p.x += sin(ph) * 0.055 * k * (0.25 + sf);
      p.y += cos(ph * 0.8) * 0.035 * k * sf;
      p.z += sin(ph * 1.3 + 1.0) * 0.03 * k * (0.3 + sf);
    } else {
      /* étoffe souple : l'ourlet se soulève et file vers l'arrière (surtout dans le dos), des plis voyagent le long du tissu */
      vec2 rd = normalize(position.xz + vec2(1e-4, 1e-4));
      float bw = uF.x > 2.5 ? 1.0 : mix(0.22, 1.0, clamp(0.5 - 0.5 * rd.y, 0.0, 1.0));
      float lift = 0.52 * sf * k * bw * uW.x;
      float yn = uF.w + (position.y - uF.w) * (1.0 - lift);
      p.z -= (yn - position.y) * 0.9 + 0.05 * k * k * bw * uW.x;
      p.y = yn;
      float aa = atan(position.x, position.z);
      float t = uTime * (2.2 + uSp * 8.0);
      float ph = aa * 7.0 + k * 5.5 - t + uF.z;
      float amp = k * (0.45 + 2.2 * sf) * uW.y;
      float w = sin(ph + 1.3 * sin(aa * 3.0 + uTime * 1.1));
      p.xz += rd * w * 0.014 * amp;
      p.x += sin(k * 6.0 - t * 1.6 + uF.z + position.z * 8.0) * 0.02 * k * (0.2 + sf) * uW.y;
      p.y += sin(ph * 0.7) * 0.012 * k * sf * uW.y;
      n.xz += rd * cos(ph) * 0.28 * amp;
      n = normalize(n);
    }
  }
  vK = vec2(uv.x, k); vUV = uv;
  vO = position;
  vN = normalMatrix * n;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  vP = mv.xyz;
  gl_Position = projectionMatrix * mv;
}`;
const FS_CLOTH = `
uniform vec3 uBase; uniform vec3 uAcc; uniform vec3 uAcc2; uniform vec3 uSunV; uniform float uGlow; uniform vec4 uP; uniform float uBoost; uniform float uTime;
varying vec3 vN; varying vec3 vP; varying vec3 vO; varying vec2 vK; varying vec2 vUV;
float h21(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float lozenge(vec2 g) { vec2 f = abs(fract(g) - 0.5); return 1.0 - step(0.5, f.x + f.y); }
const vec3 SAF = vec3(0.99, 0.67, 0.16); const vec3 RED = vec3(0.66, 0.11, 0.09); const vec3 TEAL = vec3(0.06, 0.52, 0.54);
const vec3 IVO = vec3(0.96, 0.88, 0.72); const vec3 SIL = vec3(0.82, 0.82, 0.86);
void main() {
  vec3 N = normalize(vN); bool back = !gl_FrontFacing; if (back) N = -N;
  vec3 V = normalize(-vP);
  float a = atan(vO.x, vO.z);
  vec3 col = uBase; float met = 0.0; float gold = 0.0; float sheen = 0.0; float al = 1.0;
  float pat = uP.x;
  if (pat < 0.5) { col *= 0.94 + 0.10 * h21(floor(vO.xy * 90.0 + vO.z * 61.0)); }
  else if (pat < 1.5) {
    col *= 0.94 + 0.10 * h21(floor(vO.xy * 90.0 + vO.z * 61.0));
    float b = (vO.y - uP.y) / 0.11;
    if (b < 2.6) {
      float z = abs(fract(a * 3.2) - 0.5) * 2.0;
      if (b < 1.0) col = uAcc2; else col = abs(b - 1.8 - z * 0.7) < 0.38 ? uAcc : col;
      gold = 0.5;
    }
  }
  else if (pat < 2.5) {
    float s = fract(vO.y * 22.0), t = fract(a * 7.0 + floor(vO.y * 22.0) * 0.5);
    col = mix(uBase, uAcc, step(0.66, s)); col = mix(col, uAcc2, step(0.88, s));
    col *= 0.90 + 0.18 * step(0.5, t); gold = step(0.66, s) * 0.6;
  }
  else if (pat < 3.5) {
    float f = sin(a * 3.0 + vO.y * 38.0) * 0.5 + 0.5;
    col *= 0.86 + 0.14 * f; col = mix(col, uAcc, step(0.9, fract(vO.y * 13.0 + a * 0.3)) * 0.5);
  }
  else if (pat < 4.5) {
    col *= 0.94 + 0.10 * h21(floor(vO.xy * 90.0 + vO.z * 61.0));
    float ea = abs(a);
    if (ea < 0.72) { col = mix(uAcc, uAcc2, step(0.5, fract(vO.y * 14.0))); gold = 0.5; }
    else if (ea > 2.45 && vO.y > uP.y && vO.y < uP.z) {
      vec2 g = vec2(a * 5.2, vO.y * 15.0);
      float l = lozenge(g), l2 = lozenge(g * 2.0 + 0.25);
      col = mix(uBase * 1.2, uAcc, l); col = mix(col, uAcc2, l2 * l * 0.9); gold = l * 0.5;
    } else if (vO.y < uP.w + 0.10) { col = abs(fract(a * 3.4) - 0.5) * 2.0 > (vO.y - uP.w) * 10.0 ? uAcc : uAcc2; gold = 0.4; }
  }
  else if (pat < 5.5) { met = 1.0; col *= 0.95; }
  else if (pat < 6.5) {
    float e = vK.y;
    col = mix(uBase, uAcc, step(0.76, e) * step(e, 0.82));
    col = mix(col, uAcc2, step(0.86, e) * step(e, 0.90));
    col = mix(col, uAcc, step(0.94, e));
    col *= 0.94 + 0.08 * step(0.5, fract(vK.x * 8.0)); gold = step(0.76, e) * 0.6;
  }
  else if (pat < 7.5) {
    /* étoffe de nuit : dégradé indigo, plis, ciel d'étoiles qui scintillent, bandeau de losanges dans le dos, ourlet tissé + franges */
    float u = vUV.x, v = mix(vUV.y, 1.0 - vUV.y, uP.y);
    col = mix(uBase * 1.45, uBase * mix(0.58, 1.05, uP.z), smoothstep(0.0, 0.95, v));
    col *= 0.90 + 0.10 * sin(a * 7.0 + v * 5.5);
    vec2 g = vec2(u * 54.0, v * 34.0), c = floor(g), f = fract(g) - 0.5;
    float h = h21(c);
    if (h > 0.80) {
      vec2 o = (vec2(h21(c + 7.1), h21(c + 3.3)) - 0.5) * 0.5;
      float s = smoothstep(0.27, 0.0, length(f - o)) * (0.55 + 0.45 * sin(uTime * (1.5 + h * 3.0) + h * 60.0));
      col += uAcc * s * 1.2; gold += s * 0.8;
    }
    vec2 g2 = vec2(u * 15.0, v * 10.0), c2 = floor(g2), f2 = fract(g2) - 0.5;
    float h2 = h21(c2 + 11.0);
    if (h2 > 0.72) {
      vec2 q = abs(f2 - (vec2(h21(c2 + 1.7), h21(c2 + 9.2)) - 0.5) * 0.4);
      float s2 = smoothstep(0.12, 0.0, q.x + q.y) + 0.6 * smoothstep(0.018, 0.0, min(q.x, q.y)) * smoothstep(0.30, 0.0, max(q.x, q.y));
      s2 *= 0.7 + 0.3 * sin(uTime * 2.2 + h2 * 50.0);
      col += uAcc * s2 * 1.4; gold += s2;
    }
    if (uP.z < 0.5) {
      float cu = abs(u - 0.5);
      if (cu < 0.085 && v > 0.10 && v < 0.84) {
        vec2 q = vec2((u - 0.5) / 0.085, (v - 0.10) / 0.74 * 6.5);
        vec2 ff = vec2(q.x, fract(q.y) * 2.0 - 1.0);
        float dd = abs(ff.x) + abs(ff.y), row = mod(floor(q.y), 2.0);
        col = uBase * 1.9;
        if (dd < 0.94) col = uAcc;
        if (dd < 0.76) col = mix(uAcc2, TEAL, row);
        if (dd < 0.40) col = IVO;
        gold += step(0.76, dd) * step(dd, 0.94) * 0.9;
      } else if (cu < 0.100 && v > 0.09 && v < 0.85) { col = uAcc; gold += 0.7; }
      float b = (v - 0.90) / 0.10;
      if (b > 0.0) {
        float zz = abs(fract(u * 46.0) - 0.5) * 2.0;
        if (b < 0.12) { col = uAcc; gold = 0.9; }
        else if (b < 0.22) col = uAcc2;
        else if (b < 0.80) { col = zz > (b - 0.22) * 1.7 ? IVO : TEAL; gold = 0.4; }
        else col = uAcc;
      }
      if (v > 0.978 && fract(u * 100.0) > 0.55) discard;
      if (u < 0.022 || u > 0.978) { col = mix(uAcc, uAcc2, step(0.5, fract(v * 40.0))); gold = 0.6; }
    } else if (abs(a) < uP.w + 0.10) {
      col = mix(uAcc2, uAcc, step(0.5, fract(vUV.y * 46.0))); gold = 0.7;
    }
    sheen = 0.25;
  }
  else if (pat < 8.5) {
    /* voile de gaze : transparent, brodé aux lisières, semé de paillettes d'argent */
    float u = vUV.x, e = vK.y;
    vec2 g = vec2(u * 18.0, e * 70.0), c = floor(g), f = fract(g) - 0.5;
    float h = h21(c);
    al = 0.56 + 0.10 * sin(e * 14.0 - uTime * 2.0 + u * 5.0);
    col = uBase * (0.92 + 0.10 * h21(floor(vO.xy * 140.0)));
    if (h > 0.90) {
      float s = smoothstep(0.32, 0.0, length(f)) * (0.5 + 0.5 * sin(uTime * (2.0 + h * 4.0) + h * 90.0));
      col += uAcc * s * 1.3; al = max(al, 0.95 * s); gold += s;
    }
    if (u < 0.045 || u > 0.955 || e > 0.965) { col = uAcc2; al = 0.9; gold += 0.5; }
    al *= 0.35 + 0.65 * smoothstep(0.0, 0.06, e);
    sheen = 0.4;
  }
  else if (pat < 9.5) {
    /* soie brodée : plis, ourlet de losanges (safran, henné, turquoise), liseré le long de l'ouverture */
    float b = vUV.y, hh = uP.z;
    col = uBase * (0.93 + 0.07 * sin(a * 11.0 + b * 3.0));
    sheen = 0.9;
    if (b < hh) {
      float q = b / hh;
      if (q < 0.10) { col = uAcc; gold = 0.9; }
      else if (q < 0.20) { col = uAcc2; }
      else if (q < 0.90) {
        vec2 gc = vec2(a * (uP.w > 0.5 ? uP.w : 8.0), (q - 0.2) / 0.7 * 2.0);
        gc.x += 0.5 * floor(gc.y);
        vec2 ff = fract(gc) - 0.5;
        float d = abs(ff.x) + abs(ff.y);
        col = IVO * 0.95;
        if (d < 0.50) col = uAcc2;
        if (d < 0.34) col = uAcc;
        if (d < 0.15) col = TEAL;
        gold = step(d, 0.50) * 0.5;
      } else { col = uAcc; gold = 0.9; }
    }
    if (uP.y > 0.01) {
      float de = abs(a) - uP.y;
      if (de < 0.09) { col = mix(uAcc2, uAcc, step(0.5, fract(b * 30.0))); gold = 0.6; }
    }
  }
  else if (pat < 10.5) {
    /* corsage ajusté : chaîne de losanges au centre, encolure et empiècement brodés */
    float ea = abs(a), y = vO.y;
    col = uBase * (0.93 + 0.07 * h21(floor(vO.xy * 90.0 + vO.z * 61.0)));
    sheen = 0.6;
    if (y > 1.436) { col = uAcc; gold = 0.7; }
    else if (y > 1.420) { col = uAcc2; }
    if (ea < 0.20 && y < 1.420) {
      vec2 q = vec2(a / 0.20, y * 13.0);
      vec2 ff = vec2(q.x, fract(q.y) * 2.0 - 1.0);
      float d = abs(ff.x) + abs(ff.y);
      col = uAcc2;
      if (d < 0.92) col = uAcc;
      if (d < 0.50) col = TEAL;
      gold = step(d, 0.92) * 0.6;
    }
    if (y > 1.03 && y < 1.075) { col = mix(col, uAcc, 0.35); }
  }
  else if (pat < 11.5) {
    /* tresse : rangs en chevrons, perles d'argent et de turquoise au bout */
    float e = vK.y;
    float zig = abs(fract(e * 46.0 + a * 0.5) - 0.5);
    col = uBase * (0.62 + 0.75 * smoothstep(0.1, 0.4, zig));
    if (e > 0.80) { float s = step(0.5, fract(e * 34.0)); col = mix(SIL, TEAL, s); met = 1.0 - s; gold = 0.3; }
    sheen = 0.6;
  }
  else if (pat < 12.5) {
    /* satin : reflets, rayures, bande brodée à l'ourlet (uP.y = hauteur) */
    col = uBase * (0.88 + 0.12 * sin(a * 16.0 + vO.y * 6.0));
    if (vUV.y < uP.y) { col = mix(uAcc, uAcc2, step(0.5, fract(a * 6.0))); gold = 0.7; }
    else if (vUV.y < uP.y + 0.015) { col = uAcc; gold = 0.7; }
    sheen = 1.0;
  }
  else {
    /* peau : l'ombre de la capuche tombe sur le haut du visage */
    float yy = vO.y - uP.y;
    float sh = smoothstep(0.014, 0.088, yy);
    col = uBase * mix(1.0, 0.40, sh);
    col = mix(col, col * vec3(0.72, 0.64, 1.0), sh * 0.55);
  }
  if (back) col *= 0.80;
  float t = clamp(0.5 + dot(N, uSunV) * 0.62, 0.0, 1.0);
  vec3 shadow = col * vec3(0.56, 0.50, 0.90) + vec3(0.04, 0.025, 0.09);
  vec3 lit = col * vec3(1.16, 1.03, 0.90) + vec3(0.06, 0.03, 0.0);
  vec3 o = mix(shadow, lit, smoothstep(0.2, 0.85, t));
  float rim = pow(1.0 - max(dot(N, V), 0.0), 2.6);
  o += vec3(1.0, 0.70, 0.40) * rim * (0.30 + 0.60 * smoothstep(0.1, 0.8, t)) * 0.7;
  if (sheen > 0.0) {
    vec3 R = reflect(-uSunV, N);
    float sp = pow(max(dot(R, V), 0.0), 9.0);
    o += vec3(1.0, 0.86, 0.62) * sp * 0.30 * sheen * (0.35 + 0.65 * t);
    o += col * 0.12 * sheen * pow(1.0 - max(dot(N, V), 0.0), 2.0) * t;
  }
  if (met > 0.5) {
    vec3 R = reflect(-uSunV, N);
    float sp = pow(max(dot(R, V), 0.0), 22.0);
    o = mix(o, vec3(0.78, 0.78, 0.82) * (0.36 + 0.55 * t), 0.55) + vec3(1.0, 0.92, 0.70) * sp * 0.7;
  }
  o += uBase * uGlow;
  o += vec3(1.0, 0.72, 0.26) * uBoost * (gold + met * 0.35) * (0.5 + 0.5 * sin(vO.y * 20.0 + uTime * 16.0)) * 0.7;
  gl_FragColor = vec4(o, al);
}`;

/* ---- lettres tifinaghes qui s'envolent derrière le tapis pendant le boost (atlas de glyphes 4×3) ---- */
const VS_GLYPH = `
attribute float aSize; attribute float aAlpha; attribute float aGlyph; attribute float aRot;
uniform float uPx;
varying float vA; varying float vG; varying float vR;
void main() {
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  vA = aAlpha; vG = aGlyph; vR = aRot;
  gl_PointSize = clamp(aSize * uPx / max(-mv.z, 0.5), 0.0, 160.0);
  gl_Position = projectionMatrix * mv;
}`;
const FS_GLYPH = `
uniform sampler2D uTex;
varying float vA; varying float vG; varying float vR;
void main() {
  vec2 c = gl_PointCoord - 0.5;
  float cs = cos(vR), sn = sin(vR);
  c = vec2(c.x * cs - c.y * sn, c.x * sn + c.y * cs) + 0.5;
  if (c.x < 0.0 || c.x > 1.0 || c.y < 0.0 || c.y > 1.0) discard;
  float g = floor(vG + 0.5);
  vec2 cell = vec2(mod(g, 4.0), floor(g / 4.0));
  float m = texture2D(uTex, (cell + vec2(c.x, 1.0 - c.y)) / vec2(4.0, 3.0)).a;
  if (m < 0.02) discard;
  vec3 col = mix(vec3(1.0, 0.62, 0.18), vec3(1.0, 0.93, 0.64), m * m);
  gl_FragColor = vec4(col * (0.9 + 0.7 * m), m * vA);
}`;
/* ===== AVATAR : la voyageuse voilée — une femme amazighe du Souss, silhouette fine, longue robe de soie brodée ouverte sur une sous-jupe de satin,
   cape de nuit étoilée, capuche, voile translucide à paillettes, tresses, manches amples, bijoux d'argent (fibules, diadème, tazerzit).
   Tout est procédural. Les étoffes sont des maillages denses, animés dans le vertex shader (jupes, cape, manches, voile). ===== */
function buildAvatar(THREE, X) {
  const { charU, flagU, charMat, body } = X;
  const PI = Math.PI, TAU = PI * 2;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const IVORY = [0.96, 0.89, 0.74], SAFFRON = [0.99, 0.67, 0.16], RED = [0.66, 0.11, 0.09], TEAL = [0.06, 0.52, 0.54];
  const NIGHT = [0.07, 0.08, 0.27], VIOLET = [0.30, 0.20, 0.52], GOLD = [1.0, 0.86, 0.52], SILVER = [0.84, 0.84, 0.88];
  const SKIN = [0.68, 0.46, 0.34], CORAL = [0.88, 0.22, 0.16], AMBER = [0.95, 0.55, 0.10], DEEPTEAL = [0.04, 0.30, 0.36];
  const mats = [];

  /* ---------- matériaux ---------- */
  const cm = (base, o) => {
    o = o || {};
    const mode = o.mode || 0;
    const u = {
      uBase: { value: new THREE.Color(base[0], base[1], base[2]) },
      uAcc: { value: new THREE.Color().fromArray(o.acc || [1, 1, 1]) }, uAcc2: { value: new THREE.Color().fromArray(o.acc2 || [0, 0, 0]) },
      uSunV: charU.uSunV, uGlow: { value: o.glow || 0 }, uP: { value: new THREE.Vector4(o.pat || 0, o.a || 0, o.b || 0, o.c || 0) },
      uBoost: flagU.uBoost, uTime: flagU.uTime, uSp: flagU.uSp,
      uF: { value: new THREE.Vector4(mode, o.len || 1, o.ph || 0, o.y0 || 0) }, uW: { value: new THREE.Vector2(o.lift === undefined ? 1 : o.lift, o.rip === undefined ? 1 : o.rip) }
    };
    const m = new THREE.ShaderMaterial({ vertexShader: VS_CLOTH, fragmentShader: FS_CLOTH, uniforms: u, side: o.side ? THREE.DoubleSide : THREE.FrontSide, transparent: !!o.trans, depthWrite: !o.trans, extensions: { derivatives: false } });
    m.userData.merge = !mode && !o.trans;
    mats.push(m); return m;
  };
  const SM = {};
  const solid = (c, glow) => {
    const key = c.join(',') + '|' + (glow || 0);
    if (!SM[key]) { SM[key] = charMat(c[0], c[1], c[2], glow || 0); SM[key].userData.merge = true; }
    return SM[key];
  };
  const mSilver = cm(SILVER, { pat: 5 }), mGold = cm(GOLD, { pat: 5 });
  const mSkin = cm(SKIN, { pat: 13, a: 99, glow: 0.04 });

  /* ---------- géométrie ---------- */
  const V2 = (a, b) => new THREE.Vector2(a, b);
  const smooth = (pts, n) => new THREE.SplineCurve(pts.map((p) => V2(p[0], p[1]))).getPoints(n).map((p) => V2(Math.max(p.x, 0), p.y));
  const profAt = (pts, y) => {            // rayon d'un profil (ordre croissant en y) à la hauteur y
    for (let i = 1; i < pts.length; i++) if (y <= pts[i].y) { const a = pts[i - 1], b = pts[i]; return a.x + (b.x - a.x) * clamp((y - a.y) / ((b.y - a.y) || 1), 0, 1); }
    return pts[pts.length - 1].x;
  };
  const fixSeam = (g, stride, count) => {                  // lisse les normales sur la couture (colonne 0 = dernière colonne)
    const N = g.attributes.normal;
    for (let j = 0; j < stride; j++) {
      const a = j, b = count * stride + j;
      const x = N.getX(a) + N.getX(b), y = N.getY(a) + N.getY(b), z = N.getZ(a) + N.getZ(b), l = Math.hypot(x, y, z) || 1;
      N.setXYZ(a, x / l, y / l, z / l); N.setXYZ(b, x / l, y / l, z / l);
    }
  };
  /* tour de révolution aplati (zs : échelle en z selon y), ourlet festonné (hem), décalage en z (zo) */
  const shell = (pts, seg, phiS, phiL, o) => {
    o = o || {};
    const g = new THREE.LatheGeometry(pts, seg, phiS, phiL);
    const P = g.attributes.position, nP = pts.length;
    for (let i = 0; i < P.count; i++) {
      let x = P.getX(i), y = P.getY(i), z = P.getZ(i);
      if (o.zo) z += o.zo(y);
      if (o.zs) z *= o.zs(y);
      if (o.hem) { const j = i % nP; if (j < 3) y += o.hem.amp * (0.5 + 0.5 * Math.cos(Math.atan2(x, z) * o.hem.n)) * [1, 0.45, 0.15][j]; }
      P.setXYZ(i, x, y, z);
    }
    g.computeVertexNormals();
    if (Math.abs(phiL - TAU) < 1e-4) fixSeam(g, nP, seg);
    return g;
  };
  /* surface paramétrique (u,v) ∈ [0,1]² — les normales sont orientées vers l'extérieur de l'axe vertical */
  const surf = (nu, nv, fn, cx, cz) => {
    const pos = [], uvs = [], idx = [];
    for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) { const p = fn(i / nu, j / nv); pos.push(p[0], p[1], p[2]); uvs.push(i / nu, j / nv); }
    for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) { const a = j * (nu + 1) + i, b = a + 1, c = a + nu + 1, d = c + 1; idx.push(a, c, b, b, c, d); }
    const g = new THREE.BufferGeometry();
    g.setIndex(idx); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.computeVertexNormals();
    let s = 0; const N = g.attributes.normal, P = g.attributes.position;
    for (let i = 0; i < P.count; i++) s += N.getX(i) * (P.getX(i) - (cx || 0)) + N.getZ(i) * (P.getZ(i) - (cz || 0));
    if (s < 0) { for (let t = 0; t < idx.length; t += 3) { const q = idx[t + 1]; idx[t + 1] = idx[t + 2]; idx[t + 2] = q; } g.setIndex(idx); g.computeVertexNormals(); }
    return g;
  };
  const put = (parent, geo, mat, p, r, s) => {
    const m = new THREE.Mesh(geo, mat);
    if (p) m.position.set(p[0], p[1], p[2]);
    if (r) m.rotation.set(r[0], r[1], r[2]);
    if (s) m.scale.set(s[0], s[1], s[2]);
    m.frustumCulled = false; parent.add(m); return m;
  };

  const torus = (parent, R, r, mat, p, rot, tseg, rseg) => put(parent, new THREE.TorusGeometry(R, r, rseg || 8, tseg || 24), mat, p, rot);
  const tube = (parent, pts, r, mat, segs) => put(parent, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(p[0], p[1], p[2]))), segs || 24, r, 6, false), mat);
  /* fusionne les pièces statiques de même matériau sous une racine (moins de draw calls) */
  const mergeGeos = (list) => {
    let n = 0, ni = 0;
    for (const g of list) { n += g.attributes.position.count; ni += g.index ? g.index.count : g.attributes.position.count; }
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2), idx = n < 65536 ? new Uint16Array(ni) : new Uint32Array(ni);
    let o = 0, oi = 0;
    for (const g of list) {
      const c = g.attributes.position.count;
      pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3);
      if (g.attributes.uv) uv.set(g.attributes.uv.array, o * 2);
      if (g.index) { for (let k = 0; k < g.index.count; k++) idx[oi + k] = g.index.array[k] + o; oi += g.index.count; }
      else { for (let k = 0; k < c; k++) idx[oi + k] = o + k; oi += c; }
      o += c;
    }
    const m = new THREE.BufferGeometry();
    m.setAttribute('position', new THREE.BufferAttribute(pos, 3)); m.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); m.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    m.setIndex(new THREE.BufferAttribute(idx, 1));
    return m;
  };
  const bake = (root, others) => {
    root.updateWorldMatrix(true, true);
    const inv = new THREE.Matrix4().copy(root.matrixWorld).invert(), tmp = new THREE.Matrix4();
    const buckets = new Map(), kill = [];

      for (const c of n.children) {
        if (others.indexOf(c) >= 0) continue;
        if (c.isMesh && c.material.userData.merge) {
          const g = c.geometry.clone();
          g.applyMatrix4(tmp.multiplyMatrices(inv, c.matrixWorld));

    buckets.forEach((list, mat) => { const m = new THREE.Mesh(mergeGeos(list), mat); m.frustumCulled = false; root.add(m); });
  };
  const arms = {};

  /* ================= jambes : sirwal de satin serré à la cheville, babouches brodées ================= */
  const legGeo = (() => {
    const p = smooth([[0.040, 0], [0.046, 0.05], [0.060, 0.11], [0.080, 0.20], [0.098, 0.34], [0.112, 0.52]], 14); p.push(V2(0, 0.52));
    return new THREE.LatheGeometry(p, 20);
  })();
  const slipGeo = (() => {      // babouche : semelle, empeigne, pointe relevée
    const parts = [];
    const sole = new THREE.SphereGeometry(1, 20, 12); sole.scale(0.050, 0.030, 0.118); sole.translate(0, 0.030, 0.045); parts.push(sole);
    const cone = new THREE.ConeGeometry(0.034, 0.15, 16, 1); cone.rotateX(PI / 2 - 0.42); cone.translate(0, 0.066, 0.17); parts.push(cone);
    const heel = new THREE.SphereGeometry(0.030, 12, 8); heel.scale(1.1, 0.9, 0.8); heel.translate(0, 0.036, -0.050); parts.push(heel);
    return mergeGeos(parts);
  })();
  for (const sx of [-1, 1]) {
    const leg = new THREE.Group(); leg.position.set(sx * 0.085, 0, sx > 0 ? -0.06 : 0.06); leg.rotation.y = sx * 0.15; body.add(leg);
    put(leg, legGeo, cm(DEEPTEAL, { pat: 12, acc: SAFFRON, acc2: RED, a: 0.07, mode: 2, len: 0.52, y0: 0.52, ph: sx, lift: 0.14, rip: 0.5, side: 1 }));
    put(leg, new THREE.CylinderGeometry(0.030, 0.034, 0.05, 14), mSkin, [0, 0.025, 0]);
    put(leg, slipGeo, solid([0.98, 0.78, 0.16], 0.02));
    torus(leg, 0.043, 0.0045, mSilver, [0, 0.092, 0], [PI / 2, 0, 0], 22, 6);
    for (let i = 0; i < 7; i++) { const a = i / 7 * TAU; ball(leg, 0.0055, mGold, [Math.cos(a) * 0.043, 0.080, Math.sin(a) * 0.043], null, 8); }
  }

  /* ================= sous-jupe de satin turquoise sombre + robe de soie ivoire ouverte devant ================= */
  const underPts = smooth([[0.300, 0.30], [0.285, 0.44], [0.250, 0.62], [0.215, 0.80], [0.178, 0.96], [0.150, 1.06], [0.138, 1.12]], 20);
  const zsSkirt = (y) => 0.80 + 0.20 * clamp((0.95 - y) / 0.45, 0, 1);
  put(body, shell(underPts, 64, 0, TAU, { zs: zsSkirt }), cm(DEEPTEAL, { pat: 12, acc: SAFFRON, acc2: RED, a: 0.05, mode: 2, len: 0.84, y0: 1.12, ph: 0.4, rip: 0.8, side: 1 }));
  const GAP = 0.95;
  const overPts = smooth([[0.430, 0.20], [0.382, 0.34], [0.322, 0.52], [0.250, 0.72], [0.208, 0.90], [0.172, 1.03], [0.148, 1.11], [0.142, 1.16]], 24);
  put(body, shell(overPts, 76, GAP / 2, TAU - GAP, { zs: zsSkirt, hem: { n: 9, amp: 0.045 } }), cm(IVORY, { pat: 9, acc: SAFFRON, acc2: RED, a: GAP / 2, b: 0.17, mode: 2, len: 0.96, y0: 1.16, ph: 1.9, side: 1 }));

  /* ================= corsage ajusté, ceinture tissée, pompons ================= */
  const bodPts = smooth([[0.172, 0.98], [0.158, 1.04], [0.140, 1.10], [0.136, 1.14], [0.150, 1.20], [0.170, 1.26], [0.182, 1.31], [0.188, 1.36], [0.172, 1.405], [0.118, 1.432], [0.054, 1.455]], 26);
  const zsB = (y) => 0.74 + 0.12 * clamp((1.10 - y) / 0.15, 0, 1);
  const mBod = cm(RED, { pat: 10, acc: SAFFRON, acc2: [0.30, 0.04, 0.05] });
  put(body, shell(bodPts, 52, 0, TAU, { zs: zsB }), mBod);
  for (const sx of [-1, 1]) ball(body, 0.068, mBod, [sx * 0.058, 1.265, 0.088], [1, 0.95, 0.86], 18);
  put(body, shell(smooth([[0.156, 1.03], [0.162, 1.05], [0.162, 1.13], [0.156, 1.15]], 8), 56, 0, TAU, { zs: () => 0.82 }), cm([0.62, 0.10, 0.10], { pat: 2, acc: SAFFRON, acc2: NIGHT }));
  torus(body, 0.034, 0.0075, mGold, [0, 1.09, 0.134], null, 28, 8);
  ball(body, 0.020, solid(TEAL, 0.25), [0, 1.09, 0.142], [1, 1, 0.7], 12);

  /* ================= cape de nuit étoilée : surface dense drapée sur les épaules ================= */
  const CY = 1.445;

  hd.rotation.x = lerp(hd.rotation.x, 0.12 * model.crouch - 0.10 * air + 0.02 * Math.sin(time * 0.9), kh);
  hd.rotation.z = lerp(hd.rotation.z, -model.roll * 0.30 + 0.015 * Math.sin(time * 0.6), kh);
  flagU.uSp.value = clamp(P.speed / 50, 0, 1); flagU.uBoost.value = P.boostK;
  /* ombre portée */
  const alt = Math.max(0, P.y - heightAt(P.x, P.z));
  terrU.uShAmt.value = 0.8 * clamp(1 - alt / 4.5, 0, 1);
  terrU.uShLen.value = 3.2 * (1 + 0.1 * model.crouch);
}

function updateCamera(dt, inp) {
  const sp = P.speed;
  const hv = sp > 3 ? Math.atan2(P.vx, P.vz) : P.h;
  const mix = sp > 3 ? clamp(sp / 9, 0, 1) : 0;
  const tgt = P.h + wrapPI(hv - P.h) * mix * 0.6;
  if (cam.init) { cam.yaw = tgt; }
  cam.yaw += wrapPI(tgt - cam.yaw) * damp(2.4, dt);
  if (!cam.dragging) cam.orbit *= Math.exp(-0.5 * dt);
  let yaw = cam.yaw + cam.orbit, dist = 4.15 + clamp(sp * 0.032, 0, 2.0) + 1.0 * P.boostK, height = 1.9 + 0.6 * (1 - P.tuck * 0.5);
  let introSpin = 0;
  if (!S.started) { cam.introT += dt; introSpin = Math.sin(cam.introT * 0.12) * 0.55 + 0.5; dist = 6.6; height = 2.5; }
  yaw += introSpin;
  const tx = P.x - Math.sin(yaw) * dist + P.vx * 0.06, tz = P.z - Math.cos(yaw) * dist + P.vz * 0.06;
  const gyT = heightAt(tx, tz);
  let ty = Math.max(P.y + height, gyT + 1.15);
  if (cam.init) { cam.x = tx; cam.y = ty; cam.z = tz; cam.init = false; }
  const kp = damp(sp > 2 ? 8 + Math.min(sp, 60) * 0.14 : 5, dt);
  cam.x = lerp(cam.x, tx, kp); cam.z = lerp(cam.z, tz, kp); cam.y = lerp(cam.y, ty, damp(5.5, dt));
  const gy = heightAt(cam.x, cam.z) + 0.9;
  if (cam.y < gy) cam.y = gy;
  cam.shake *= Math.exp(-5 * dt);
  const sh = cam.shake + 0.012 * P.boostK, t = time * 40;
  camera.position.set(cam.x - ORG.x + Math.sin(t) * sh, cam.y + Math.cos(t * 1.3) * sh, cam.z - ORG.z);
  const lf = 3.2;
  camera.lookAt(P.x - ORG.x + Math.sin(yaw) * lf, P.y + 1.0 + (S.started ? 0 : 0.25), P.z - ORG.z + Math.cos(yaw) * lf);
  if (DBG.cam) { const o = DBG.cam.o, t = DBG.cam.t; camera.position.set(P.x - ORG.x + o[0], P.y + o[1], P.z - ORG.z + o[2]); camera.lookAt(P.x - ORG.x + t[0], P.y + t[1], P.z - ORG.z + t[2]); }
  const aspectK = Math.max(1, 1.35 / camera.aspect);
  const base = 56 + clamp(sp / 60, 0, 1) * 11 + 9 * P.boostK;
  const fov = Math.min(92, 2 * Math.atan(Math.tan(base * D2R / 2) * aspectK) / D2R);
  if (Math.abs(fov - camera.fov) > 0.01) { camera.fov = lerp(camera.fov, fov, damp(3, dt)); camera.updateProjectionMatrix(); }
}

function updateUniforms() {
  const cx = P.x, cz = P.z;
  updatePhases(cx, cz);
  terrain3.position.set(cx - ORG.x, 0, cz - ORG.z);
  wisps.position.copy(terrain3.position);
  terrU.uCamLocal.value.set(camera.position.x - terrain3.position.x, camera.position.y, camera.position.z - terrain3.position.z);
  terrU.uTime.value = time;
  const mod = (v, m) => ((v % m) + m) % m;
  terrU.uRP.value.set(mod(RIPPLE.kr * (WIND.x * cx + WIND.z * cz), TAU), mod(RIPPLE.w1[0] * cx + RIPPLE.w1[1] * cz, TAU), mod(RIPPLE.w2[0] * cx + RIPPLE.w2[1] * cz, TAU), mod(RIPPLE.w3[0] * cx + RIPPLE.w3[1] * cz, TAU));
  terrU.uPP.value.set(mod(RIPPLE.pw1[0] * cx + RIPPLE.pw1[1] * cz, TAU), mod(RIPPLE.pw2[0] * cx + RIPPLE.pw2[1] * cz, TAU));
  terrU.uCell.value.set(mod(cx * RIPPLE.cellScale, 4096), mod(cz * RIPPLE.cellScale, 4096));
  const M2 = 2 * WBOX;
  wispU.uCM.value.set(mod(cx, M2), mod(cz, M2));
  wispU.uWindMove.value.set(mod(WIND.x * WINDSP * time, M2), mod(WIND.z * WINDSP * time, M2));
  const px = renderer.domElement.height / (2 * Math.tan(camera.fov * D2R / 2));
  wispU.uPx.value = px; sprayU.uPx.value = px; orbU.uPx.value = px; glyU.uPx.value = px;
  camera.updateMatrixWorld();
  const e = camera.matrixWorld.elements;
  skyU.uCR.value.set(e[0], e[1], e[2]); skyU.uCU.value.set(e[4], e[5], e[6]); skyU.uCF.value.set(-e[8], -e[9], -e[10]);
  const th = Math.tan(camera.fov * D2R / 2);
  skyU.uTan.value.set(th * camera.aspect, th);
  skyU.uTime.value = time;
  /* direction du soleil dans le repère caméra, pour le personnage */
  charU.uSunV.value.copy(SUN).transformDirection(camera.matrixWorldInverse);
}

/* ---------- air time, saltos, jauge de boost ---------- */
let bestAir = parseFloat(store('bestAir')) || 0;
let prevJump = false, prevBrake = false;
const airUI = { until: 0, live: false };
const setText = (el, txt) => { if (el.textContent !== txt) el.textContent = txt; };
function gainPop(g) {
  if (g < 0.004) return;
  const el = $('boostGain'), box = $('boost');
  el.textContent = '+' + Math.round(g * 100) + ' %';
  el.classList.remove('pop'); box.classList.remove('pulse'); void el.offsetWidth;
  el.classList.add('pop'); box.classList.add('pulse');
}
/* un appui sur Espace (ou ↓) en plein vol déclenche un salto : un tour complet à chaque appui, jusqu'à trois */
function handleFlipInput(inp) {
  if (S.started && inAir() && P.airTime > 0.3 && Math.abs(model.flipTarget) < 2.5 * TAU) {
    if (inp.jump && !prevJump) model.flipTarget += TAU;
    else if (inp.brake && !prevBrake) model.flipTarget -= TAU;
  }
  prevJump = !!inp.jump; prevBrake = !!inp.brake;
}
function showAirResult(value, sub, record) {
  const el = $('air');
  setText($('airK'), tr('airLabel')); setText($('airV'), value); setText($('airS'), sub);
  el.classList.add('show'); el.classList.toggle('rec', !!record);
  airUI.until = time + 2.8; airUI.live = false;
}
/* réception : bilan du vol, bonus de boost, pénalité si le salto n'est pas terminé */
function onTouchdown() {
  const air = P.lastAir, tilt = Math.abs(wrapPI(model.flip));
  const flips = Math.round(Math.abs(model.flipTarget) / TAU), clean = tilt < 0.9;
  if (air >= 0.45) {
    let gain = clamp((air - 0.45) * 0.12, 0, 0.3);
    if (clean) gain += flips * 0.09;
    const before = P.energy; P.energy = Math.min(1, P.energy + gain);
    const rec = air >= 0.9 && air > bestAir + 0.05;
    if (rec) { bestAir = air; store('bestAir', air.toFixed(2)); }
    const parts = [];
    if (flips) parts.push(tr('flipsLabel').replace('{n}', flips));
    if (flips || !clean) parts.push(clean ? tr('cleanLabel') : tr('roughLabel'));
    if (P.energy - before > 0.004) parts.push('+' + Math.round((P.energy - before) * 100) + ' %');
    parts.push(rec ? tr('recordLabel') : (bestAir > 0 ? tr('bestLabel') + ' ' + bestAir.toFixed(1) + ' s' : ''));
    showAirResult(air.toFixed(1) + ' s', parts.filter(Boolean).join(' · '), rec);
    gainPop(P.energy - before);
    if (audio.ctx && S.sound && (clean && (flips || air > 1.2))) { bell(PENTA[5], 0.06); setTimeout(() => bell(PENTA[7], 0.05), 90); }
  }
  if (!clean) {                       // salto interrompu : la réception coûte de la vitesse
    P.vx *= 0.82; P.vy *= 0.82; P.vz *= 0.82; cam.shake = Math.min(0.16, cam.shake + 0.08);
    for (let i = 0; i < 22; i++) { const a = Math.random() * TAU, s = 1.5 + Math.random() * 3; emit(P.x, P.y + 0.15, P.z, Math.cos(a) * s + P.vx * 0.3, 0.8 + Math.random() * 2, Math.sin(a) * s + P.vz * 0.3, 0.3 + Math.random() * 0.4, 0.8 + Math.random() * 0.8, 0.6, Math.random() * 0.5); }
  }
  model.flip = wrapPI(model.flip); model.flipTarget = 0;
}
const hudS = { e: -1 };
function updateHud() {
  const e = P.energy, box = $('boost');
  if (Math.abs(e - hudS.e) > 0.002) { hudS.e = e; $('boostFill').style.transform = 'scaleX(' + e.toFixed(3) + ')'; box.setAttribute('aria-valuenow', Math.round(e * 100)); }
  box.classList.toggle('on', P.boosting); box.classList.toggle('low', e < 0.15 || P.boostLock);
  $('boostfx').style.opacity = (P.boostK * 0.9).toFixed(3);
  const el = $('air');
  if (S.started && inAir() && P.airTime > 0.45) {
    airUI.live = true; airUI.until = 0;
    setText($('airK'), tr('airLabel')); setText($('airV'), P.airTime.toFixed(1) + ' s');
    const n = Math.round(Math.abs(model.flipTarget) / TAU);
    setText($('airS'), n ? tr('flipsLabel').replace('{n}', n) : '');
    el.classList.add('show'); el.classList.remove('rec');
  } else if (time >= airUI.until) { el.classList.remove('show'); airUI.live = false; }
}

function frame(now) {
  requestAnimationFrame(frame);
  const dtms = now - last; last = now;
  const dt = clamp(dtms / 1000, 0.0005, 0.05);
  time += dt;
  const inp = readInput();
  if (S.started) { handleFlipInput(inp); stepWorld(dt, inp); }
  rebaseIfNeeded();
  updateOrbs(dt);
  updateModel(dt, inp);
  updateEffects(dt);
  updateCamera(dt, inp);
  camera.updateMatrixWorld(); camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  updateUniforms();
  updateAudio(dt);
  updateHud();
  renderer.render(scene, camera);
  adapt(dtms, now);
  /* HUD */
  hudT += dt; fpsT += dt; fpsN++;
  if (hudT > 0.1) { hudT = 0; const kmh = Math.round(P.speed * 3.6); if ($('speedv').textContent != kmh) $('speedv').textContent = kmh; }
  if (fpsT > 0.5) { if (S.fps) $('fps').textContent = Math.round(fpsN / fpsT) + ' ' + tr('fpsUnit') + ' · ×' + curPR.toFixed(2); fpsT = 0; fpsN = 0; }
}

/* ---------- démarrage (et reprise après une mise à jour de la page) ---------- */
function boot(data) {
  resetPlayer(true);
  const sv = data && data.p;
  if (sv && isFinite(sv.x) && isFinite(sv.z)) {
    Object.assign(P, sv); P._jumpHeld = false;
    model.yaw = P.h; cam.init = true;
    if (data.started) { S.started = true; $('intro').hidden = true; $('intro').classList.add('gone'); $('app').classList.remove('intro-on'); }
  }
  applyQuality();
  $('app').classList.add('ready');
  /* quelques pas pour que le premier plan soit déjà installé (écharpe, caméra) */
  for (let i = 0; i < 4; i++) { rebaseIfNeeded(); updateModel(0.016, { steer: 0 }); updateCamera(0.016, { steer: 0 }); }
  requestAnimationFrame((t) => { last = t; frame(t); });
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ p: { x: P.x, y: P.y, z: P.z, vx: P.vx, vy: P.vy, vz: P.vz, h: P.h, energy: P.energy }, started: S.started }));
  if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
} catch (e) { boot({}); }

window.__sillage = { body, avatar, glyphTex, gly, DBG, flagU, orbs, ORB, model, onTouchdown, collectOrb, scanOrbs, uploadOrbs, terrMat, TU, updatePhases, P, S, cam, ORG, PRESETS, applyQuality, resetPlayer, camera, renderer, stepWorld, readInput, keys, setTime(t) { time = t; }, SUN };
})();

</script>
